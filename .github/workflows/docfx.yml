# Your GitHub workflow for DocFX documentation deployment

name: DocFX Deployment

# Trigger on push to main, but only when documentation or the API-doc sources change.
# (API reference is generated from src/**; other churn does not affect the site.)
#
# Also on push to `benchmarks`, the orphan branch holding recorded benchmark runs: the trends
# database is generated from it at build time, so a newly recorded run has to republish the site
# to become visible. `threading/**` is that branch's layout and matches nothing on main, so it
# adds no spurious main builds. Note that `paths` applies to every listed branch, which is why the
# archive needs its own entry rather than being covered by `docfx/**`.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - benchmarks
    paths:
      - 'docfx/**'
      - 'src/**'
      - 'threading/**'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    # Explicitly main, never the triggering ref: a push to `benchmarks` would otherwise check out
    # the orphan data branch, which has no docfx/, src/ or scripts/, and the build would fail
    # before it started.
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: main

    # The run archive, into a directory of its own. It lives outside docfx/, so nothing here is
    # picked up as site content.
    - name: Checkout benchmark run archive
      uses: actions/checkout@v7
      with:
        ref: benchmarks
        path: .benchmarks-archive

    - name: Dotnet Setup
      uses: actions/setup-dotnet@v6
      with:
        # 8.x for docfx itself, which ships a net8.0 tool; 10.x so the API metadata step can load
        # the projects, whose target frameworks include net10.0.
        dotnet-version: |
          8.x
          10.x

    - name: Python Setup
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    # The trends database is a derived artifact, rebuilt here rather than committed: it is a
    # multi-megabyte binary that sqlite rewrites wholesale on every change, so committing it added
    # a fresh incompressible blob to history for data that is fully reproducible from the archive.
    - name: Build benchmark trends databases
      run: |
        python scripts/threading-benchmark-trends/import_run_archive.py \
          --archive .benchmarks-archive \
          --db docfx/packages/threading/benchmark-trends/benchmark-history.sqlite
        python scripts/cryptography-benchmark-trends/import_run_archive.py \
          --archive .benchmarks-archive \
          --db docfx/packages/security/cryptography/benchmark-trends/benchmark-history.sqlite

    # Publishing a dashboard with no data is worse than failing, because it looks like a result.
    # The importer exits non-zero when the archive is missing entirely; this catches the subtler
    # case where it ran, found nothing to import, and left an empty database behind.
    - name: Verify the trends databases have data
      run: |
        for db in docfx/packages/threading/benchmark-trends/benchmark-history.sqlite \
                  docfx/packages/security/cryptography/benchmark-trends/benchmark-history.sqlite; do
          rows=$(python -c "import sqlite3,sys; print(sqlite3.connect(sys.argv[1]).execute('select count(*) from benchmark_results').fetchone()[0])" "$db")
          echo "$db: $rows row(s)"
          if [ "$rows" -eq 0 ]; then
            echo "::error::$db is empty - refusing to publish a dashboard with no data."
            exit 1
          fi
        done

    - run: dotnet tool update -g docfx
    - run: docfx docfx/docfx.json
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: 'docfx/_site'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
