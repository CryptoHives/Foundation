name: ACVP Full Vector Sets

# Runs the post-quantum conformance suites against the *complete* NIST ACVP vector sets, rather
# than the selections the repository embeds.
#
# ML-KEM and the pure ML-DSA set embed everything they can run. Three sets cannot be embedded
# whole:
#
#   SLH-DSA, pure      456 cases, 11.8 MB gzipped   -> 180 committed (~2.15 MB)
#   SLH-DSA, pre-hash  456 cases, 15.9 MB gzipped   ->  37 committed (~1.38 MB)
#   ML-DSA,  pre-hash  135 cases,  2.11 MB gzipped  ->  57 committed (~0.88 MB)
#
# SLH-DSA signatures are 7,856 to 49,856 bytes each, and the pre-hash sets multiply the case count
# by the twelve approved pre-hash functions. The repository therefore carries stratified selections
# that still cover every parameter set — and, for the pre-hash sets, every pre-hash function — and
# this workflow downloads the full sets weekly so nothing is only ever checked in the small files.
#
# See the two fetch scripts for the stratification rules, and the *AcvpVectors classes for how the
# CRYPTOHIVES_*_ACVP_VECTORS variables override the embedded resources.

on:
  schedule:
    # Tuesdays, 05:00 UTC — a day after the published-packages run, so the two do not compete.
    - cron: '0 5 * * 2'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to test. Empty = the default branch.'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  slh-dsa:
    name: SLH-DSA (FIPS 205), full ACVP set
    runs-on: ubuntu-latest
    # The 's' parameter sets dominate: a single signature is on the order of 10^6 hash
    # invocations, and the full set signs with all twelve.
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Fetch the complete SLH-DSA vector set
      run: python scripts/fetch-slhdsa-acvp-vectors.py --profile full

    - name: Run the SLH-DSA conformance suite
      env:
        # The loader also finds this file at its default path on its own; setting the variable
        # makes the choice explicit in the log and fails loudly if the fetch step wrote nothing.
        CRYPTOHIVES_SLHDSA_ACVP_VECTORS: tests/Security/Cryptography/TestData/slhdsa-acvp-fips205.full.json.gz
      run: >
        dotnet test tests/Security/Cryptography/Cryptography.Tests.csproj
        -c Release --framework net10.0
        --filter "FullyQualifiedName~SlhDsaAcvpTests"
        --logger "console;verbosity=normal"

    - name: Confirm the committed selection still regenerates byte-identically
      # Compression is deterministic (mtime zeroed, compact separators), so regenerating the
      # stratified profile must reproduce the committed file exactly. A diff here means either
      # NIST republished a vector file or the script's selection rule drifted — both are things
      # to notice on a schedule rather than discover in a pull request.
      run: |
        python scripts/fetch-slhdsa-acvp-vectors.py --profile stratified
        git diff --exit-code -- tests/Security/Cryptography/TestData/slhdsa-acvp-fips205.json.gz

  pre-hash:
    name: HashML-DSA and HashSLH-DSA, full ACVP sets
    runs-on: ubuntu-latest
    # Same reason as above, and the pre-hash sigGen set signs with all twelve parameter sets under
    # all twelve pre-hash functions.
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Fetch the complete pre-hash vector sets
      run: |
        python scripts/fetch-mldsa-acvp-vectors.py --profile prehash-full
        python scripts/fetch-slhdsa-acvp-vectors.py --profile prehash-full

    - name: Run the pre-hash conformance suites
      env:
        CRYPTOHIVES_MLDSA_PREHASH_ACVP_VECTORS: tests/Security/Cryptography/TestData/mldsa-prehash-acvp-fips204.full.json.gz
        CRYPTOHIVES_SLHDSA_PREHASH_ACVP_VECTORS: tests/Security/Cryptography/TestData/slhdsa-prehash-acvp-fips205.full.json.gz
      run: >
        dotnet test tests/Security/Cryptography/Cryptography.Tests.csproj
        -c Release --framework net10.0
        --filter "FullyQualifiedName~PreHashAcvpTests"
        --logger "console;verbosity=normal"

    - name: Confirm the committed selections still regenerate byte-identically
      run: |
        python scripts/fetch-mldsa-acvp-vectors.py --profile prehash
        python scripts/fetch-slhdsa-acvp-vectors.py --profile prehash
        git diff --exit-code -- tests/Security/Cryptography/TestData/mldsa-prehash-acvp-fips204.json.gz
        git diff --exit-code -- tests/Security/Cryptography/TestData/slhdsa-prehash-acvp-fips205.json.gz
