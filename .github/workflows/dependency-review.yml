# Dependency security
#  - dependency-review (PRs): blocks PRs that INTRODUCE dependencies with known
#    vulnerabilities or incompatible licenses. Runs only when the dependency graph can
#    actually change (manifests / lock files).
#  - vulnerable-deps (weekly): sweeps the whole resolved graph on the default branch, so a
#    CVE disclosed later against a dependency already on main - including a transitive one -
#    is caught. The PR-triggered review never re-checks those.

name: Dependency Review

on:
  pull_request:
    paths:
    - '**/*.csproj'
    - '**/Directory.Packages.props'
    - '**/packages.lock.json'
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    # PR-only: the action diffs base vs. head and has nothing to do on a schedule.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          # Fail on moderate or higher severity vulnerabilities
          fail-on-severity: moderate
          # Only gate on runtime (shipping) dependencies. Test/build-only tooling is still
          # reviewed, but its licenses/vulnerabilities do not fail the check.
          fail-on-scopes: runtime
          # Deny copyleft licenses that are incompatible with MIT
          deny-licenses: GPL-3.0, AGPL-3.0, GPL-2.0, LGPL-2.0, LGPL-2.1, LGPL-3.0
          # Allow common permissive licenses
          # allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Unlicense, CC0-1.0, 0BSD
          # Exempt these vetted MIT packages from the license check. Both ship only the
          # deprecated licenseUrl (no SPDX expression), so GitHub reports them as "unknown":
          #   NUnit.Console                  -> MIT (github.com/nunit/nunit-console)
          #   OpenGost.Security.Cryptography -> MIT (github.com/sergezhigunov/OpenGost)
          allow-dependencies-licenses: pkg:nuget/NUnit.Console, pkg:nuget/OpenGost.Security.Cryptography
          # Comment on PR with findings
          comment-summary-in-pr: always

  vulnerable-deps:
    # Scheduled / on-demand sweep of the entire resolved dependency graph.
    if: github.event_name != 'pull_request'
    name: vulnerable dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Restore (not build) is TFM-agnostic for packages, so the net4x/netstandard
      # projects resolve fine on Linux; only building them would need targeting packs.
      - name: Restore
        run: dotnet restore "CryptoHives .NET Foundation.sln"

      - name: List vulnerable packages (direct + transitive)
        run: |
          OUT=$(dotnet list "CryptoHives .NET Foundation.sln" package --vulnerable --include-transitive 2>&1 || true)
          echo "$OUT"
          if echo "$OUT" | grep -Eq 'Critical|High|Moderate|Low'; then
            echo "::error::Vulnerable packages detected in the resolved dependency graph"
            exit 1
          fi
          echo "No known-vulnerable packages."
